name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  worker-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install worker test dependencies
        run: pip install aiohttp flask pyyaml requests websocket-client
      - name: Run worker tests
        run: python -m unittest discover -s codex-cli-worker/tests -v

  release-package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version alignment and build HACS ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("custom_components/codex_cli/manifest.json"))["version"])')"
          python scripts/build_hacs_release.py "v${version}" "$RUNNER_TEMP/hacs-release"
